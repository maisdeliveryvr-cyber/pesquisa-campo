<style>
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: app-like single column — sticky red header with city switch, content cards, bottom tab bar like the Mais Delivery app. Single committed light look (brand app is white + red). */
:root{
  --red:#D7141A; --red-dark:#A80F14; --red-soft:#FDECEC; --orange:#F5A000; --orange-soft:#FFF4DC;
  --ink:#231A1A; --muted:#6E5F5E; --line:#EADFDD; --bg:#F7F3F2; --card:#FFFFFF;
  --green:#178A3A; --green-soft:#E3F4E8; --amber:#B36B00; --amber-soft:#FFF1D6; --crit:#B3141A;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--red);color:#fff;box-shadow:0 2px 10px rgba(120,10,12,.25)}
.top-in{max-width:560px;margin:0 auto;padding:10px 16px 12px;display:grid;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo-chip{background:#fff;border-radius:14px;padding:3px 8px;display:flex;align-items:center;flex:none}
.logo-chip img{height:34px;width:auto;display:block}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.05;letter-spacing:.2px}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:12px;opacity:.85;letter-spacing:.3px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(0,0,0,.18);border-radius:999px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:#fff;border-radius:999px;padding:7px 8px;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--red)}
.pin{width:12px;height:12px;flex:none}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--red);background:var(--red-soft)}

/* generic */
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:4px 0 0;line-height:1.15;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:17px;margin:0;line-height:1.2}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.stack{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--red)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;background:var(--red);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{background:var(--red-dark)}
.btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.quiet{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--crit);border:1.5px solid var(--crit)}
.btn.danger.armed{background:var(--crit);color:#fff}
.btn[disabled]{opacity:.5}
.banner{border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--amber-soft);color:#6B4100;border:1px solid #F2D29A}
.banner.info{background:var(--orange-soft);color:#6B4100}
.num{font-variant-numeric:tabular-nums}

/* home */
.hero{display:grid;grid-template-columns:1fr 118px;gap:8px;align-items:end;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;padding:14px 0 0 14px}
.hero img{width:118px;height:auto;display:block;align-self:end}
.hero .txt{padding-bottom:14px;min-width:0}
.hero .say{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.05;color:var(--red)}
.hero p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.goals{display:grid;gap:10px}
.goal{display:grid;gap:5px}
.goal-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:14px}
.goal-row span:last-child{color:var(--muted);font-weight:700}
.bar{height:9px;background:#F1E7E5;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .3s}
.bar i.done{background:var(--green)}
.newgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.newbtn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 12px;text-align:left;display:grid;gap:8px;min-height:104px}
.newbtn .ic{width:38px;height:38px;border-radius:12px;background:var(--red-soft);color:var(--red);display:grid;place-items:center}
.newbtn .ic svg{width:22px;height:22px}
.newbtn b{font-family:var(--display);font-size:16.5px;font-weight:700;line-height:1.1}
.newbtn small{color:var(--muted);font-size:12.5px;line-height:1.25}

/* form */
.formhead{display:flex;align-items:center;gap:10px}
.back{border:0;background:#fff;border:1px solid var(--line);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--red)}
.back svg{width:20px;height:20px}
.section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:16px}
.section > header{display:grid;gap:2px}
.section > header .hint{color:var(--muted);font-size:13px}
.q{display:grid;gap:7px;min-width:0}
.q label,.q .ql{font-weight:700;font-size:14.5px}
.q .req{color:var(--red)}
.q input[type=text],.q input[type=tel],.q input[type=number],.q textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#FFFCFB;min-width:0}
.q textarea{min-height:76px;resize:vertical}
.q input:focus,.q textarea:focus{border-color:var(--red);outline:none;background:#fff}
.pre{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#FFFCFB;overflow:hidden}
.pre span{padding:0 4px 0 12px;color:var(--muted);font-weight:700}
.pre input{border:0!important;background:transparent!important;padding-left:4px!important}
.pre:focus-within{border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:700;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.scale{display:grid;gap:5px}
.scale.s11{grid-template-columns:repeat(11,1fr)}
.scale.s5{grid-template-columns:repeat(5,1fr)}
.scale button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;min-width:0}
.scale button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#3A2400}
.scale-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:600}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.savebar-in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.savebar .btn{flex:1}
.err{color:var(--crit);font-size:13px;font-weight:700}

/* list */
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}
.item{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%}
.item .ic{width:44px;height:44px;border-radius:12px;background:var(--red-soft);color:var(--red);display:grid;place-items:center}
.item .ic svg{width:22px;height:22px}
.item .mid{min-width:0}
.item b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{min-width:44px;text-align:center;border-radius:10px;padding:5px 6px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.score.hi{background:var(--green-soft);color:var(--green)}
.score.mid{background:var(--amber-soft);color:var(--amber)}
.score.lo{background:var(--red-soft);color:var(--crit)}
.score.na{background:var(--bg);color:var(--muted)}
.pend{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;color:var(--amber);background:var(--amber-soft);border-radius:6px;padding:1px 6px;vertical-align:middle}
.empty{text-align:center;padding:26px 16px;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty img{width:96px;border-radius:14px}

/* detail */
.kv{display:grid;gap:10px}
.kv div{display:grid;gap:2px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.kv div:last-child{border-bottom:0}
.kv dt{font-size:12.5px;color:var(--muted);font-weight:700}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}

/* placar */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:800;background:#FFF9F8}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:800;background:var(--orange-soft)}
td select{border:1.5px solid var(--line);border-radius:9px;padding:5px 6px;background:#fff;font-weight:800;font-variant-numeric:tabular-nums}
.verdicts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.verdict{border-radius:16px;padding:12px;border:1px solid var(--line);background:#fff;display:grid;gap:4px}
.verdict .city{font-weight:800;font-size:13px;color:var(--muted)}
.verdict .pts{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.verdict .pts small{font-size:15px;color:var(--muted)}
.pill{justify-self:start;border-radius:999px;padding:3px 10px;font-weight:800;font-size:12.5px}
.pill.go{background:var(--green-soft);color:var(--green)}
.pill.adj{background:var(--amber-soft);color:var(--amber)}
.pill.no{background:var(--red-soft);color:var(--crit)}
.pill.na{background:var(--bg);color:var(--muted)}
.signals{display:grid;gap:8px}
.sig{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.sig i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.sig i.ok{background:var(--green-soft);color:var(--green)}
.sig i.no{background:var(--red-soft);color:var(--crit)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (max-width:380px){.scale.s11{grid-template-columns:repeat(6,1fr)}.newgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.linkbtn{border:0;background:none;padding:4px 0;color:var(--red);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.who{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 0}
.q input[type=email],.q input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#FFFCFB;min-width:0}
.q input[type=email]:focus,.q input[type=password]:focus{border-color:var(--red);outline:none;background:#fff}
.login .linkbtn{justify-self:center}
</style>

function ctl(q,v){
  const id="q-"+q.k;
  switch(q.type){
   case"text":return '<input type="text" id="'+id+'" data-k="'+q.k+'" value="'+esc(v||"")+'"'+(q.ph?' placeholder="'+esc(q.ph)+'"':"")+'>';
   case"tel":return '<input type="tel" inputmode="tel" placeholder="(61) 9 0000-0000" id="'+id+'" data-k="'+q.k+'" value="'+esc(v||"")+'">';
   case"number":return '<input type="number" inputmode="numeric" id="'+id+'" data-k="'+q.k+'" data-num="1" value="'+(v==null?"":esc(v))+'">';
   case"money":return '<div class="pre"><span>R$</span><input type="number" inputmode="decimal" step="0.01" id="'+id+'" data-k="'+q.k+'" data-num="1" value="'+(v==null?"":esc(v))+'"></div>';
   case"textarea":return '<textarea id="'+id+'" data-k="'+q.k+'">'+esc(v||"")+'</textarea>';
   case"choice":return '<div class="chips" role="group">'+q.opts.map(o=>'<button type="button" class="chip" data-k="'+q.k+'" data-v="'+esc(o)+'" data-mode="one" aria-pressed="'+(v===o)+'">'+esc(o)+'</button>').join("")+'</div>';
   case"multi":{const a=Array.isArray(v)?v:[];return '<div class="chips" role="group">'+q.opts.map(o=>'<button type="button" class="chip" data-k="'+q.k+'" data-v="'+esc(o)+'" data-mode="many" aria-pressed="'+a.includes(o)+'">'+esc(o)+'</button>').join("")+'</div>'}
   case"scale10":return '<div class="scale s11" role="group">'+Array.from({length:11},(_,i)=>'<button type="button" data-k="'+q.k+'" data-n="'+i+'" aria-pressed="'+(v===i)+'">'+i+'</button>').join("")+'</div><div class="scale-ends"><span>Nenhum interesse</span><span>Quer entrar já</span></div>';
   case"scale5":return '<div class="scale s5" role="group">'+[1,2,3,4,5].map(i=>'<button type="button" data-k="'+q.k+'" data-n="'+i+'" aria-pressed="'+(v===i)+'">'+i+'</button>').join("")+'</div><div class="scale-ends"><span>Ruim</span><span>Ótimo</span></div>';
  }}

function avg(a){a=a.filter(x=>typeof x==="number"&&!isNaN(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null}
function stats(c){
  const E=cityFichas(c,"estab").map(f=>f.resp||{}),D=cityFichas(c,"entreg").map(f=>f.resp||{}),C=cityFichas(c,"cons").map(f=>f.resp||{});
  const e7=E.filter(r=>r.interesse>=7);
  const pc=x=>C.length?Math.round(C.filter(x).length/C.length*100)+"%":"—";
  return{nE:E.length,mE:avg(E.map(r=>r.interesse)),e7:e7.length,a7:e7.filter(r=>r.classe==="A").length,
    ticket:avg(E.map(r=>r.ticket)),ped:avg(E.map(r=>r.pedidosUtil)),
    nD:D.length,mD:avg(D.map(r=>r.interesse)),dC:D.filter(r=>r.deixaContato==="Sim").length,vP:avg(D.map(r=>r.valorEntrega)),vM:avg(D.map(r=>r.valorMinimo)),
    nC:C.length,pede:pc(r=>r.pedeDelivery==="Sim"),usaria:pc(r=>r.usariaApp==="Sim"),gasto:avg(C.map(r=>r.gasto))}}
function totalOf(c){const n=S.notas[c]||{};let s=0,all=true;CRIT.forEach(k=>{const v=n[k.k];if(v)s+=v*k.w;else all=false});return{s,all,any:CRIT.some(k=>n[k.k])}}
function verdict(t){if(!t.any)return'<span class="pill na">Sem notas</span>';if(!t.all)return'<span class="pill na">Notas incompletas</span>';
  return t.s>70?'<span class="pill go">Implantar</span>':t.s>=50?'<span class="pill adj">Implantar com ajustes</span>':'<span class="pill no">Não implantar agora</span>'}

   row("Consumidores ouvidos",a.nC,b.nC)+row("Pedem delivery",a.pede,b.pede)+row("Usariam um app local",a.usaria,b.usaria)+row("Gasto médio por pedido",money(a.gasto),money(b.gasto))+'</tbody></table></div>';
  const sig=(ok,t)=>'<div class="sig"><i class="'+(ok?"ok":"no")+'">'+(ok?"✓":"–")+'</i><span>'+t+'</span></div>';

  const tA=totalOf("pb"),tB=totalOf("cz");
  const mat='<div class="tbl-wrap"><table><thead><tr><th>Critério</th><th class="n">Peso</th><th class="n">Padre B.</th><th class="n">Cocal.</th></tr></thead><tbody>'+

  const vcard=(c,t)=>'<div class="verdict"><span class="city">'+esc(CITIES[c])+'</span><span class="pts num">'+(t.any?t.s:"—")+'<small> /100</small></span>'+verdict(t)+'</div>';
  app.innerHTML='<div class="stack">'+statusBanner()+'<div><div class="eyebrow">Comparativo</div><h2>Placar das duas cidades</h2><p class="sub">Os indicadores se atualizam a cada ficha salva. As notas de 1 a 5 da matriz são dadas pelo administrador no fim da viagem.</p></div>'+
   '<div class="verdicts">'+vcard("pb",tA)+vcard("cz",tB)+'</div>'+
   '<section class="stack"><h3>Sinais mínimos para recomendar</h3>'+sigs("pb")+sigs("cz")+'</section>'+
   '<section class="stack"><h3>Indicadores de campo</h3>'+ind+'</section>'+
   '<section class="stack"><h3>Matriz de viabilidade</h3><p class="sub" style="margin:0">Acima de 70: implantar · 50 a 70: implantar com ajustes · abaixo de 50: não implantar agora.</p>'+mat+'</section></div>';
}

/* ---------- Firebase ---------- */
let auth=null,db=null;
const ERR={"auth/invalid-credential":"E-mail ou senha incorretos.","auth/wrong-password":"E-mail ou senha incorretos.","auth/user-not-found":"E-mail ou senha incorretos.","auth/invalid-email":"Esse e-mail não parece válido.","auth/too-many-requests":"Muitas tentativas. Espere alguns minutos e tente de novo.","auth/network-request-failed":"Sem internet. No primeiro acesso é preciso estar conectado.","auth/user-disabled":"Este acesso foi desativado. Fale com o Lucas.","auth/missing-password":"Digite a senha."};
function errMsg(e){return ERR[e&&e.code]||"Não foi possível entrar. Confira os dados e tente de novo."}
function startData(){
  stopData();
  S.unsubs.push(db.collection("fichas").onSnapshot({includeMetadataChanges:true},snap=>{
    S.fichas=snap.docs.map(d=>Object.assign({id:d.id,_pend:d.metadata.hasPendingWrites},d.data()));
    if(S.view!=="form")render()},er=>{console.error(er);toast(er&&er.code==="permission-denied"?"Seu e-mail ainda não foi liberado na equipe. Fale com o Lucas.":"Não foi possível carregar as fichas. Confira sua conexão.")}));
  S.unsubs.push(db.collection("matriz").doc("notas").onSnapshot(d=>{if(d.exists){const x=d.data();S.notas={pb:Object.assign({},x.pb),cz:Object.assign({},x.cz)};if(S.view==="placar")renderPlacar()}},()=>{}));
}
function checkAdmin(){
  // Só administradores conseguem ler admin/check (regra no Firebase). Sem permissão = usuário comum.
  db.collection("admin").doc("check").get().then(()=>{S.admin=true;if(S.view!=="form")render()}).catch(()=>{});
}
function stopData(){S.unsubs.forEach(u=>{try{u()}catch(e){}});S.unsubs=[];S.fichas=[]}
function initFirebase(){
  if(configOk&&!window.firebase){S.noSdk=true}
  if(!configOk||!window.firebase){render();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth();db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  auth.languageCode="pt";
  auth.onAuthStateChanged(u=>{
    S.ready=true;
    S.user=u;S.nome=u?(u.displayName||""):"";S.admin=false;
    if(u){startData();checkAdmin()}else{stopData();S.view="login"}
    render()});
}

/* ---------- Ações ---------- */
function go(v){S.view=v;render();if(v!=="form")window.scrollTo(0,0)}
function draftKey(t,c){return "pesquisaCampoMD.draft."+t+"."+c}
function startForm(t,existing){
  if(existing){S.edit={id:existing.id,tipo:existing.tipo,cidade:existing.cidade,resp:JSON.parse(JSON.stringify(existing.resp||{})),criadoEm:existing.criadoEm,autorUid:existing.autorUid,autorNome:existing.autorNome}}
  else{const d=ls(draftKey(t,S.city));S.edit={id:null,tipo:t,cidade:S.city,resp:d||{}};if(d)setTimeout(()=>toast("Rascunho recuperado"),50)}
  go("form")}
let draftT;function saveDraft(){const e=S.edit;if(e&&!e.id){clearTimeout(draftT);draftT=setTimeout(()=>{if(S.edit===e)ls(draftKey(e.tipo,e.cidade),e.resp)},400)}}
function clean(r){const o={};Object.keys(r).forEach(k=>{const v=r[k];if(v===""||v==null||(Array.isArray(v)&&!v.length))return;o[k]=v});return o}
function submitForm(){
  const e=S.edit,F=FORMS[e.tipo];const err=document.getElementById("ferr");
  const miss=F.sections.flatMap(s=>s.qs).filter(q=>q.req&&!String(e.resp[q.k]||"").trim());
  if(miss.length){err.textContent="Preencha: "+miss.map(q=>q.l).join(", ")+".";err.hidden=false;const el=document.getElementById("q-"+miss[0].k);if(el){el.focus();el.scrollIntoView({block:"center"})}return}
  const now=Date.now();
  const doc={tipo:e.tipo,cidade:e.cidade,resp:clean(e.resp),criadoEm:e.criadoEm||now,atualizadoEm:now,
    autorUid:e.autorUid||S.user.uid,autorNome:e.autorNome||S.nome};
  const ref=e.id?db.collection("fichas").doc(e.id):db.collection("fichas").doc();
  // Sem await: com o cache offline, a ficha aparece na hora e é enviada quando houver conexão.
  ref.set(doc).catch(er=>{console.error(er);toast(er&&er.code==="permission-denied"?"Sem permissão para salvar esta ficha.":"Erro ao enviar a ficha. Tente de novo.")});
  clearTimeout(draftT);
  if(!e.id)lsDel(draftKey(e.tipo,e.cidade));
  S.edit=null;S.listFilter="all";
  toast(S.online?"Ficha salva":"Ficha salva no celular · será enviada quando a internet voltar");
  go("list");
}
function delFicha(id){
  db.collection("fichas").doc(id).delete().catch(er=>{console.error(er);toast("Não foi possível excluir esta ficha.")});
  toast("Ficha excluída");S.view="list";render()}
function setNota(c,k,v){
  if(!S.admin)return;
  S.notas[c]=Object.assign({},S.notas[c]);if(v)S.notas[c][k]=v;else delete S.notas[c][k];
  renderPlacar();
  db.collection("matriz").doc("notas").set({pb:S.notas.pb||{},cz:S.notas.cz||{},atualizadoEm:Date.now()}).catch(()=>toast("Não foi possível salvar a nota."))}
function csvExport(){
  const cols=[];const seen=new Set();TYPES.forEach(t=>FORMS[t].sections.forEach(s=>s.qs.forEach(q=>{if(!seen.has(q.k)){seen.add(q.k);cols.push(q)}})));
  const CSVL={nome:"Nome",bairro:"Bairro / distrito",whatsapp:"WhatsApp",interesse:"Interesse (0 a 10)",obs:"Observações",idade:"Idade"};
  const cell=v=>{if(Array.isArray(v))v=v.join(", ");v=v==null?"":String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const head=["Tipo","Cidade","Data","Preenchido por"].concat(cols.map(q=>CSVL[q.k]||q.l));
  const rows=allFichas().map(f=>[FORMS[f.tipo].label,CITIES[f.cidade],when(f.criadoEm),f.autorNome||""].concat(cols.map(q=>(f.resp||{})[q.k])));
  const csv="﻿"+[head].concat(rows).map(r=>r.map(cell).join(";")).join("\r\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download="fichas-campo-mais-delivery.csv";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000)}

/* ---------- Eventos ---------- */
document.querySelector(".seg").addEventListener("click",ev=>{const b=ev.target.closest("[data-city]");if(!b)return;
  if(S.view==="form"){toast("Termine ou descarte a ficha antes de trocar de cidade");return}
  S.city=b.dataset.city;ls("pesquisaCampoMD.city",S.city);if(S.view==="detail")S.view="list";render()});
document.getElementById("nav").addEventListener("click",ev=>{const b=ev.target.closest("[data-view]");if(b)go(b.dataset.view)});
app.addEventListener("click",ev=>{
  const t=ev.target.closest("button");if(!t)return;
  if(t.id==="lg-reset"){const em=(document.getElementById("lg-email").value||"").trim();const er=document.getElementById("lg-err");
    if(!em){er.textContent="Digite seu e-mail acima e toque de novo em “Esqueci minha senha”.";er.hidden=false;return}
    auth.sendPasswordResetEmail(em).then(()=>{er.hidden=true;toast("Enviamos um link para "+em+" criar uma nova senha")}).catch(e=>{er.textContent=errMsg(e);er.hidden=false});return}
  if(t.id==="sair"){auth.signOut();return}
  if(t.dataset.new){startForm(t.dataset.new);return}
  if(t.dataset.filter){S.listFilter=t.dataset.filter;renderList();return}
  if(t.dataset.open){S.detail=t.dataset.open;go("detail");return}
  if(t.id==="csv"){csvExport();return}
  if(t.id==="toList"){go("list");return}
  if(t.id==="editF"){const f=allFichas().find(x=>x.id===S.detail);if(f)startForm(f.tipo,f);return}
  if(t.id==="delF"){if(t.classList.contains("armed")){delFicha(S.detail)}else{t.classList.add("armed");t.textContent="Toque de novo para excluir";setTimeout(()=>{if(t.isConnected){t.classList.remove("armed");t.textContent="Excluir"}},3500)}return}
  if(t.id==="cancel"||t.id==="cancel2"){const ed=S.edit;const back=ed&&ed.id?"detail":"home";if(ed&&!ed.id){clearTimeout(draftT);if(t.id==="cancel2"){lsDel(draftKey(ed.tipo,ed.cidade));toast("Ficha descartada")}else{ls(draftKey(ed.tipo,ed.cidade),ed.resp);toast("Rascunho guardado")}}S.edit=null;go(back);return}
  if(S.view==="form"&&S.edit){
    const k=t.dataset.k;if(!k)return;
    if(t.dataset.n!=null){const n=Number(t.dataset.n);S.edit.resp[k]=S.edit.resp[k]===n?null:n;t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.n)===S.edit.resp[k])))}
    else if(t.dataset.mode==="one"){const v=t.dataset.v;S.edit.resp[k]=S.edit.resp[k]===v?null:v;t.parentElement.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===S.edit.resp[k])))}
    else if(t.dataset.mode==="many"){const v=t.dataset.v;const a=Array.isArray(S.edit.resp[k])?S.edit.resp[k].slice():[];const i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);S.edit.resp[k]=a;t.setAttribute("aria-pressed",String(i<0))}
    saveDraft()}
});
app.addEventListener("input",ev=>{
  const el=ev.target;if(S.view!=="form"||!S.edit||!el.dataset.k)return;
  if(el.dataset.num){const v=el.value===""?null:Number(el.value);S.edit.resp[el.dataset.k]=isNaN(v)?null:v}else S.edit.resp[el.dataset.k]=el.value;
  saveDraft()});
app.addEventListener("change",ev=>{const s=ev.target;if(s.dataset&&s.dataset.crit){setNota(s.dataset.c,s.dataset.crit,s.value?Number(s.value):null)}});
app.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.tagName==="INPUT"&&S.view==="form"){ev.preventDefault();ev.target.blur()}});
app.addEventListener("submit",ev=>{
  ev.preventDefault();const f=ev.target;
  if(f.id==="loginForm"){
    const em=document.getElementById("lg-email").value.trim(),pw=document.getElementById("lg-senha").value,er=document.getElementById("lg-err"),btn=document.getElementById("lg-btn");
    if(!em||!pw){er.textContent="Preencha e-mail e senha.";er.hidden=false;return}
    btn.disabled=true;btn.textContent="Entrando…";
    auth.signInWithEmailAndPassword(em,pw).catch(e=>{er.textContent=errMsg(e);er.hidden=false;btn.disabled=false;btn.textContent="Entrar"});return}
  if(f.id==="nomeForm"){
    const nm=document.getElementById("nm-nome").value.trim().replace(/\s+/g," ");const er=document.getElementById("nm-err");
    if(nm.length<2){er.textContent="Digite seu nome.";er.hidden=false;return}
    S.user.updateProfile({displayName:nm}).then(()=>{S.nome=nm;S.view="home";render()}).catch(()=>{er.textContent="Não foi possível salvar. Confira a internet.";er.hidden=false});return}
  if(f.id==="ficha"){if(ev.submitter&&ev.submitter.id!=="save")return;submitForm()}
});
window.addEventListener("online",()=>{S.online=true;if(S.view!=="form"&&S.user)render()});
window.addEventListener("offline",()=>{S.online=false;if(S.view!=="form"&&S.user)render()});

/* ---------- Início ---------- */
render();
initFirebase();

})();
</script>
